    <script>
      // Obtiene el producto seleccionado de localStorage
      const product = JSON.parse(localStorage.getItem("selectedProduct"));
      const userName = [
        "Juan Perez",
        "Sofia Perez",
        "Carlos Ruiz",
        "Laura Gómez",
        "Pedro Martínez",
      ];

      // Verifica si el producto existe y muestra sus detalles
      if (product) {
        document.getElementById("product-detail").innerHTML = `
                <div class="image-container">
                    <img src="${product.image}" alt="${
          product.name
        }" class="product-image">
                   
                </div>
                <div class="info-container">
                    <h2 class="text-left">${product.name}</h2>
                    <p class="pt-4"><strong>Descripción:</strong> ${
                      product.description || "No disponible"
                    }</p>
                    <p><strong>Precio:</strong> ${product.price}</p>
                   
                    <p><strong>Categoría:</strong> ${
                      product.category || "No especificado"
                    }</p>
                    <p><strong>Tiempo de entrega:</strong> ${
                      product.delivery_time || "No especificado"
                    }</p>
                    <p><strong>Costo de envío:</strong> ${
                      product.shipping_cost || "No especificado"
                    }</p>
                    <p><strong>Opciones de entrega:</strong> ${
                      product.delivery_options &&
                      product.delivery_options.length > 0
                        ? product.delivery_options.join(", ")
                        : "No especificadas"
                    }</p>
                    <p><strong>Información de devolución:</strong> <a href="${
                      product.return_info
                    }" target="_blank">Ver información de cambios y devoluciones</a></p>
                    <p><strong>Información de contacto:</strong> <a href="${
                      product.contact_info
                    }">Contactar</a></p>
                    <p><strong>Garantía:</strong> ${
                      product.warranty || "No especificada"
                    }</p>
                    <button class="btn-add-to-cart mt-4">Agregar al carrito</button>

                </div>
            `;
       
        document.getElementById("user-reviews").innerHTML = `
            <h2 class="">Reseñas de usuarios</h2>
            <ul class="d-flex justify-content-around mt-5">
                ${
                  product.user_reviews && product.user_reviews.length > 0
                    ? product.user_reviews
                        .map((review) => {
                          // Selecciona un nombre de usuario aleatorio
                          const randomUserName =
                            userName[
                              Math.floor(Math.random() * userName.length)
                            ];
                          return `
                            <li>
                               
                                <h4> <img src="/imgs/icons8-usuario-masculino-en-círculo-25.png" alt="" class="img-fluid rounded-circle pr-1">${randomUserName}</h4>
                                <h3>${review.review}</h3>
                                <p> ${"⭐".repeat(review.rating)} (${
                            review.rating
                          } estrellas)</p>
                            </li>
                        `;
                        })
                        .join("")
                    : "<li>No hay reseñas disponibles.</li>"
                }
            </ul>
        `;
      } else {
        document.getElementById("product-detail").innerHTML =
          "<p>No se encontró el producto.</p>";
      }
    </script>

    <script>
      // Función para agregar el producto al carrito
      function addToCart(product) {
        // Obtiene el carrito actual del localStorage o lo inicializa
        let cart = JSON.parse(localStorage.getItem("cart")) || [];

        // Verificar si el producto ya existe en el carrito (usando 'id' como clave única)
        const existingProduct = cart.find((item) => item.id === product.id);

        
        if (existingProduct) {
            // Si el producto ya está en el carrito, aumenta su cantidad
            existingProduct.quantity = (existingProduct.quantity || 1) + 1;
          } else {
            // Si el producto no está en el carrito, lo agrega con una cantidad inicial de 1
            product.quantity = 1;
            cart.push(product);
          }
          // Guarda el carrito actualizado en localStorage
          localStorage.setItem("cart", JSON.stringify(cart));

          // Muestra una alerta de confirmación con SweetAlert
          Swal.fire({
            title: "Producto agregado al carrito",
            text: `${product.name} ha sido agregado a tu carrito.`,
            icon: "success",
            <!-- confirmButtonText: "Aceptar", -->
            showConfirmButton: false,
            timer:2000,

            
          });
        }
      

      // Añadir evento al botón de agregar al carrito
      document
        .querySelector(".btn-add-to-cart")
        .addEventListener("click", function () {
          // Asegúrate de pasar el producto adecuado a la función (por ejemplo, un objeto 'product')
          addToCart(product);
        });
    </script>
