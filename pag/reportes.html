<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte de Gimnasios</title>
  <link rel="stylesheet" href="/css/reportes.css">
</head>
<body>

    <h1>Sistema de Reporte de Gimnasios</h1>
    <form id="gymReportForm">
        <label for="id">Número de identificación:</label>
        <input type="text" id="id" name="id" required>
    
        <label for="province">Selecciona tu provincia:</label>
        <select id="province" name="province" required>
            <option value="">--Selecciona una provincia--</option>
            <option value="San Jose">San José</option>
            <option value="Alajuela">Alajuela</option>
            <option value="Heredia">Heredia</option>
        </select>
    
        <label for="gyms">Selecciona un gimnasio:</label>
        <select id="gymsSelect" name="gyms"></select>
    
        <button type="button" onclick="generateWhatsAppLink()">Generar enlace de reporte</button>
    </form>
    
    <a id="whatsappLink" href="#" target="_blank" style="display:none;">Enviar reporte por WhatsApp</a>
    
    <script>
    function generateWhatsAppLink() {
        const id = document.getElementById("id").value;
        const province = document.getElementById("province").value;
        const gym = document.getElementById("gymsSelect").value;
        
        if (id && province && gym) {
            const message = `Hola, mi cédula es ${id}. Quiero reportar un gimnasio en ${province}: ${gym}.`;
            const encodedMessage = encodeURIComponent(message);
            const phoneNumber = "50662412024"; // Número de WhatsApp del técnico
            
            const link = `https://wa.me/${phoneNumber}?text=${encodedMessage}`;
            
            const whatsappLink = document.getElementById("whatsappLink");
            whatsappLink.href = link;
            whatsappLink.style.display = "inline";
        } else {
            alert("Por favor, completa todos los campos antes de generar el enlace.");
        }
    }
    </script>
    

   <script src=""></script>
</body>
</html>
